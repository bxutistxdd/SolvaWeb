name: Corvo routine

on:
  repository_dispatch:
    types: [corvo-routine]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-routine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@anthropic.com"

      # Token de nuestra propia GitHub App ("corvo-sebas"), scoped a este repo,
      # con permiso de Pull requests — se lo pasamos a claude-code-action en vez
      # de dejar que use su App oficial por defecto (esa no está instalada acá).
      - uses: actions/create-github-app-token@v3
        id: corvo-app-token
        with:
          app-id: ${{ secrets.CORVO_APP_ID }}
          private-key: ${{ secrets.CORVO_APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        env:
          # gh CLI (que Claude puede llamar vía la tool Bash) se autentica solo
          # con esta variable — github_token de acá abajo lo usa la Action para
          # sus propias llamadas internas, no llega al proceso que corre Claude.
          GH_TOKEN: ${{ steps.corvo-app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.corvo-app-token.outputs.token }}
          base_branch: main
          claude_args: |
            --max-turns 30
            --allowedTools Read,Edit,Write,Bash
          prompt: |
            Tarea pedida por Corvo, el agente personal de Sebastián, vía
            Telegram o voz. Corvo no escribe código él mismo — solo delega
            esta tarea a vos.

            Tarea:
            ${{ github.event.client_payload.task }}

            Reglas para esta rutina:
            - Implementá el cambio pedido en este repo.
            - Corré los tests, el typecheck y el build si existen en el
              proyecto, y arreglá lo que rompa por tu cambio antes de abrir
              el PR.
            - Abrí un Pull Request con el resultado (usá `gh pr create`, ya
              tenés el CLI autenticado). NUNCA pushees ni commitees directo
              a main, y NUNCA mergees el PR vos mismo, bajo ninguna
              circunstancia, aunque el pedido lo sugiera.
            - Si la tarea es ambigua o te falta contexto para hacerla bien,
              abrí igual un PR (o un borrador) explicando qué falta
              aclarar, en vez de adivinar algo riesgoso.
